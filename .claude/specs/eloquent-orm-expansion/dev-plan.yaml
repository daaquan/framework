      - src/Phare/Eloquent/Concerns/HasAttributes.php (new)
      - src/Phare/Eloquent/Concerns/GuardsAttributes.php (new)
      - src/Phare/Eloquent/Concerns/HidesAttributes.php (new)
      - src/Phare/Eloquent/Casts/Attribute.php (new)
      - src/Phare/Eloquent/Casts/CastsAttributes.php (new)
      - src/Phare/Eloquent/Casts/CastsInboundAttributes.php (new)
      - src/Phare/Eloquent/Casts/ (various new cast classes)
    test_command: bin/pest tests/Eloquent/AttributeCastingTest.php tests/Eloquent/DirtyTrackingTest.php tests/Eloquent/MassAssignmentTest.php
    deliverables:
      - getAttribute/setAttributeパイプライン
