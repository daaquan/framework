## Eloquent ORM Expansion — Development Plan

overview: |
  Extend the Phalcon-based Eloquent ORM to match Laravel features. Breaking refactors are permitted.
  Port Laravel Eloquent design patterns while retaining useful Phalcon components.

reference:
  laravel: /opt/laravel-framework/src/Illuminate/Database/Eloquent/
  phare: /opt/phare/framework/src/Phare/Eloquent/

architecture_decisions:
  - Hybrid: Use Phalcon Model/Criteria/ModelManager for persistence and query execution, with Eloquent-compatible traits and a Builder on top
  - SoftDeletes: Replace static find/findFirst patches with builder-applied global scopes
  - Attribute pipeline: Replace __get/__set-based handling with getAttribute/setAttribute/transformModelValue
  - Through/many-to-many: Implement custom join queries instead of using native Phalcon relation metadata

tasks:
  ELQ-01:
    name: Builder foundation — scope system
    type: default
    dependencies: []
    file_scope:
      - src/Phare/Eloquent/Builder.php
      - src/Phare/Eloquent/BuilderInterface.php
      - src/Phare/Eloquent/Scope.php (new)
      - src/Phare/Eloquent/Concerns/HasGlobalScopes.php (new)
      - src/Phare/Eloquent/SoftDeletingScope.php (new)
      - src/Phare/Eloquent/Model.php
      - src/Phare/Eloquent/Concerns/SoftDeletes.php
    test_command: bin/pest tests/Eloquent/BuilderScopesTest.php tests/Eloquent/SoftDeletesScopeTest.php
    deliverables:
      - Model boot/initialize pipeline
      - Register, apply, and exclude global scopes
      - Local scopes (scopeXxx pattern)
      - newQuery/newModelQuery/newQueryWithoutScopes
      - SoftDeletes withTrashed/onlyTrashed/withoutTrashed
      - No regressions in existing tests

