## Eloquent ORM Expansion — Development Plan

overview: |
  Phalcon版Eloquent ORMをLaravel同等の機能レベルまで拡張。破壊的リファクタ許可。
  Phalcon部品は活用しつつ、Laravel Eloquentの設計パターンを移植する。

reference:
  laravel: /opt/laravel-framework/src/Illuminate/Database/Eloquent/
  phare: /opt/phare/framework/src/Phare/Eloquent/

architecture_decisions:
  - Hybrid: Phalcon Model/Criteria/ModelManagerを永続化・クエリ実行に活用、上にEloquent互換trait/Builder構築
  - SoftDeletes: 静的find/findFirstパッチからbuilder適用型グローバルスコープへ移行
  - 属性パイプライン: __get/__setベースからgetAttribute/setAttribute/transformModelValueパイプラインへ
  - Through/多対多: Phalconネイティブrelation metadataではなくカスタムjoinクエリで実装

tasks:
  ELQ-01:
    name: Builder基盤 — スコープシステム
    type: default
    dependencies: []
    file_scope:
      - src/Phare/Eloquent/Builder.php
      - src/Phare/Eloquent/BuilderInterface.php
      - src/Phare/Eloquent/Scope.php (new)
      - src/Phare/Eloquent/Concerns/HasGlobalScopes.php (new)
      - src/Phare/Eloquent/SoftDeletingScope.php (new)
      - src/Phare/Eloquent/Model.php
      - src/Phare/Eloquent/Concerns/SoftDeletes.php
    test_command: bin/pest tests/Eloquent/BuilderScopesTest.php tests/Eloquent/SoftDeletesScopeTest.php
    deliverables:
      - モデルboot/initializeパイプライン
      - グローバルスコープ登録・適用・除外
      - ローカルスコープ(scopeXxxパターン)
      - newQuery/newModelQuery/newQueryWithoutScopes
      - SoftDeletes withTrashed/onlyTrashed/withoutTrashed
      - 既存テスト回帰なし

  ELQ-02:
    name: 属性パイプライン — アクセサ・ミューテータ・キャスト・ダーティトラッキング
    type: default
    dependencies: []
    file_scope:
